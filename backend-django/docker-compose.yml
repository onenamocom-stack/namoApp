# Dev convenience for when docker pulls work again. Tests never need this —
# they run on SQLite (config.settings.test). services are declared with
# profiles so `docker compose up postgres redis` gives just the datastores.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: namo
      POSTGRES_PASSWORD: namo
      POSTGRES_DB: namo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U namo"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    # No Dockerfile in phase 1 — build the image when the first deployment
    # lands. Run with the repo mounted for now.
    image: python:3.13-slim
    working_dir: /app
    volumes:
      - ..:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DATABASE_URL: postgres://namo:namo@postgres:5432/namo
      REDIS_URL: redis://redis:6379/0
    command: >
      sh -c "pip install -r requirements.txt &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["full"]

volumes:
  pgdata:

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A missing secret is substituted as an empty string, so without this the
      # build stays green and Pages serves a white screen. Fail here instead,
      # where the reason is on the log line.
      - name: Verify Supabase env is present
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "::error::VITE_SUPABASE_URL secret is missing or empty"; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "::error::VITE_SUPABASE_ANON_KEY secret is missing or empty"; exit 1; }
      # Vite inlines VITE_* at build time. Without these the bundle calls
      # createClient(undefined, undefined), which throws on load — a white
      # screen, not a degraded app. The anon key is meant to ship (rule 7 in
      # backend/INSTRUCTIONS.md); it lives in repo secrets so rotating it does
      # not need a commit.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        # NO `timeout:` HERE, AND THAT IS THE FINDING. The action caps it at
        # 600000ms and warns "timeout value is greater than the allowed maximum
        # - timeout set to the maximum of 600000 milliseconds" — so ten minutes
        # is a ceiling, not a default, and raising it is a no-op that reads like
        # a fix. Tried on 1 Sep and reverted the same day.
        #
        # Which means: a GitHub Pages deploy that hangs past ten minutes WILL
        # fail here, and there is nothing in this file that can prevent it.
        # It is not our failure and it leaves the previous bundle serving, so
        # the site stays up and stays stale. The remedy is one command:
        #
        #     gh run rerun <run-id> --failed
        #
        # On 1 Sep that turned a ten-minute timeout into a 19-second success on
        # the identical commit. Normal here is 33-43s; ten minutes means stuck.

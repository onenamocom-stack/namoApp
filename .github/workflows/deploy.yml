name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A missing secret is substituted as an empty string, so without this the
      # build stays green and Pages serves a white screen. Fail here instead,
      # where the reason is on the log line.
      - name: Verify Supabase env is present
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "::error::VITE_SUPABASE_URL secret is missing or empty"; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "::error::VITE_SUPABASE_ANON_KEY secret is missing or empty"; exit 1; }
      # Vite inlines VITE_* at build time. Without these the bundle calls
      # createClient(undefined, undefined), which throws on load — a white
      # screen, not a degraded app. The anon key is meant to ship (rule 7 in
      # backend/INSTRUCTIONS.md); it lives in repo secrets so rotating it does
      # not need a commit.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          # GitHub Pages accepts the artifact and then applies it, and this
          # action only POLLS for that to finish. On 1 Sep it polled
          # `updating_pages` for the full default ten minutes and aborted —
          # build had passed in 19s, the artifact was fine, and the identical
          # commit deployed in 19s on a plain re-run. Nothing in this repo can
          # fail once and pass on a retry.
          #
          # Twenty minutes turns a slow Pages into a slow green build instead
          # of a red X and a site left serving the previous bundle. It does not
          # make anything faster; it stops us calling GitHub's queue our
          # failure. Normal here is 33-43s, so anything near this ceiling is
          # still worth looking at.
          timeout: 1200000

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f1efec" />
    <meta
      name="description"
      content="Namo — a premium astrology app. Front-end prototype, no backend."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      One family, seven weights. CRED runs on Gilroy, which is licensed — Plus
      Jakarta Sans is the closest free geometric sans to it: same low contrast
      and open apertures, and it holds up at 10px caps, which is where most
      geometric sans fall apart and where this UI spends most of its type.
    -->
    <!--
      Noto Sans Devanagari beside it, because Plus Jakarta Sans has no Indic
      coverage at all. Without this every Hindi string silently falls back to
      whatever the OS has — Nirmala UI on Windows, something else on Android —
      and a bilingual screen renders in two unrelated typefaces. Loaded in the
      same request; the stack in tailwind.config.js puts Jakarta first so Latin
      is unaffected and only Devanagari resolves to Noto.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Namo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Connecting हिन्दु-स्थान. Follow gurus and astrologers, share your bhakti, sit for darshan every day, and read your kundli."
    />
    <!--
      What WhatsApp, Instagram and every other app show when a 1namo.com link
      is shared (5 Oct 2026). Absolute URLs: a crawler does not resolve a
      relative one. Every link shows this one card — the routes live after the
      #, which crawlers never read, so a reel cannot carry its own preview.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NAMO" />
    <meta property="og:title" content="NAMO — Connecting हिन्दु-स्थान" />
    <meta property="og:description" content="Bhakti, darshan, gurus and your kundli. Follow, post and share." />
    <meta property="og:url" content="https://1namo.com/" />
    <meta property="og:image" content="https://1namo.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://1namo.com/og.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Poppins, six weights — the rounded geometric sans Sri Mandir's look is
      set in (30 Sep 2026; it replaced Plus Jakarta Sans). Poppins ships
      Devanagari, so Hindi and English share one face. Noto Sans Devanagari
      stays in the same request as the fallback for any glyph Poppins lacks.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The installable app and the Android (TWA) build read this. 19 Oct 2026. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>NAMO — Connecting हिन्दु-स्थान</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

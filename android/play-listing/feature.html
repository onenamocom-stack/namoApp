<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body {
    font-family: Poppins, sans-serif;
    background: #FBFAF6;
    position: relative;
  }
  .weave { position: absolute; inset: 0; opacity: .035;
    background-image: repeating-linear-gradient(45deg, #7a4a1a 0 1px, transparent 1px 7px),
                      repeating-linear-gradient(-45deg, #7a4a1a 0 1px, transparent 1px 7px); }
  .band { position: absolute; left: 0; right: 0; bottom: 0; height: 10px;
    background: linear-gradient(90deg, #E8762C 0 45%, #0F766E 45% 85%, #4C9A3F 85%); }
  .left { position: absolute; left: 64px; top: 0; bottom: 10px; width: 470px;
    display: flex; flex-direction: column; justify-content: center; }
  .logo { width: 250px; }
  h1 { margin-top: 26px; font-size: 44px; line-height: 1.15; font-weight: 700; color: #2B1A0E; }
  h1 .hi { font-family: 'Tiro Devanagari Hindi', serif; font-weight: 400; color: #C2410C; font-size: 50px; }
  .chips { margin-top: 26px; display: flex; flex-wrap: wrap; gap: 10px; max-width: 450px; }
  .chip { font-size: 17px; font-weight: 600; color: #0F766E; background: rgba(15,118,110,.10);
    border-radius: 999px; padding: 6px 16px; }
  .chip.s { color: #B45309; background: rgba(232,118,44,.14); }
  .right { position: absolute; right: 36px; top: 34px; width: 470px; height: 420px; }
  .tile { position: absolute; width: 168px; height: 300px; border-radius: 22px; overflow: hidden;
    box-shadow: 0 18px 40px rgba(70,40,10,.28); border: 4px solid #FFF8EC; }
  .tile img { width: 100%; height: 140%; object-fit: cover; object-position: center top; }
  .t1 { left: 0; top: 70px; transform: rotate(-7deg); }
  .t2 { left: 150px; top: 20px; z-index: 2; width: 180px; height: 330px; }
  .t3 { left: 300px; top: 70px; transform: rotate(7deg); }
</style></head>
<body>
  <div class="weave"></div>
  <div class="left">
    <img class="logo" src="namo-logo.png">
    <h1>Connecting<br><span class="hi">हिन्दु-स्थान!</span></h1>
    <div class="chips">
      <span class="chip s">Live Darshan</span><span class="chip">Status</span><span class="chip s">Jaap</span>
      <span class="chip">Astrology</span><span class="chip s">Social</span>
    </div>
  </div>
  <div class="right">
    <div class="tile t1"><img src="shree-kashi-vishwanath.webp"></div>
    <div class="tile t2"><img src="kashtbhanjan-dev-hanumanji.webp"></div>
    <div class="tile t3"><img src="banke-bihari.webp"></div>
  </div>
  <div class="band"></div>
</body></html>
